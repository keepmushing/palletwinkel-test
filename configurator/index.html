<!doctype html>
<!-- ==========================================================
     'T PALLETJE — CONFIGURATOR (TIJDELIJKE DOORVERWIJZING)
     De nieuwe configurator is nog niet af en staat onder
     /configurator/nieuw.html. Tot dan stuurt deze pagina elke
     bezoeker door naar de oorspronkelijke configurator.

     Een echte 301 kan op deze hosting niet: Hostinger Horizons
     negeert .htaccess en server.js draait niet (README, "De echte
     404"). Daarom meta refresh + location.replace.

     Terugzetten: dit bestand weg, nieuw.html terug index.html
     noemen, en CONFIGURATOR_URL in assets/js/site.js terug op
     "/configurator/".
     ========================================================== -->
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurator | 't Palletje</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=https://configurator.palletje.be/">
<link rel="canonical" href="https://configurator.palletje.be/">
<script>location.replace("https://configurator.palletje.be/");</script>
</head>
<body>
<p>U wordt doorgestuurd naar de configurator. Gebeurt er niets? <a href="https://configurator.palletje.be/">Open de configurator</a>.</p>
</body>
</html>
